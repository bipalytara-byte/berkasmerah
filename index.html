<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berkas Merah: Detektif Bisnis Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --wall:#cfded5; --wall-2:#bccfc4; --surface:#eef4ef; --ink:#1f2523; --ink-soft:#4b5a54;
  --line:#97ada1;
  --manila:#e4c98c; --manila-ink:#4a3a17;
  --paper:#fbf8ef; --paper-ink:#1f2523; --paper-soft:#5d5a50; --paper-line:#d9d1bd;
  --stamp:#5a3e8e; --string:#b3352b; --ok:#2f6b4f; --hl:#f6df72;
  --overlay:rgba(18,28,24,.62);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --wall:#15201c; --wall-2:#1c2a25; --surface:#223029; --ink:#e4ebe7; --ink-soft:#a6b6ae;
    --line:#3a4d45; --manila:#c9ab68; --manila-ink:#1f1708;
    --paper:#ece5d2; --paper-ink:#1f2523; --paper-soft:#55524a; --paper-line:#cfc6af;
    --stamp:#a990e0; --string:#e2685d; --ok:#79c9a2; --hl:#efd25a;
    --overlay:rgba(4,8,6,.74);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --wall:#15201c; --wall-2:#1c2a25; --surface:#223029; --ink:#e4ebe7; --ink-soft:#a6b6ae;
  --line:#3a4d45; --manila:#c9ab68; --manila-ink:#1f1708;
  --paper:#ece5d2; --paper-ink:#1f2523; --paper-soft:#55524a; --paper-line:#cfc6af;
  --stamp:#a990e0; --string:#e2685d; --ok:#79c9a2; --hl:#efd25a;
  --overlay:rgba(4,8,6,.74);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;background:var(--wall);color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.tw{font-family:'Special Elite','Courier New',Courier,monospace;font-weight:400;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 18px;background:var(--wall-2);border-bottom:2px solid var(--line)}
#hud .brand{font-family:'Special Elite','Courier New',monospace;font-size:21px;margin-right:auto;display:flex;align-items:center;gap:10px}
#hud .brand svg{width:26px;height:26px}
.stat{font-family:'Special Elite','Courier New',monospace;font-size:15px;color:var(--ink-soft);white-space:nowrap}
.stat b{color:var(--ink);font-weight:400}
.hud-btns{display:flex;gap:8px}

/* Buttons */
.btn{font-family:'Special Elite','Courier New',monospace;font-size:16px;background:var(--manila);color:var(--manila-ink);border:2px solid var(--manila-ink);padding:9px 16px;border-radius:3px;box-shadow:3px 3px 0 var(--manila-ink);transition:transform .08s, box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--manila-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--manila-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.small{font-size:14px;padding:6px 11px}
.btn.red{background:var(--string);color:#fff;border-color:#5a1510;box-shadow:3px 3px 0 #5a1510}

main{max-width:1200px;margin:0 auto;padding:18px 18px 140px}
.hidden{display:none!important}

/* Title */
.title-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:10px}
@media (max-width:880px){.title-wrap{grid-template-columns:1fr}}
.title-art{border:3px solid var(--manila-ink);border-radius:4px;overflow:hidden;background:#000}
.title-art svg{display:block;width:100%;height:auto}
.title-wrap h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:0 0 6px}
.title-wrap .sub{font-size:19px;color:var(--ink-soft);margin:0 0 18px;max-width:34ch}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{font-family:'Special Elite','Courier New',monospace;font-size:15px}
.field input,.field textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px}
.field textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--ink-soft);margin:16px 0 0;padding:0;list-style:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Case head */
.casehead{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin:4px 0 14px}
.casehead h2{margin:0;font-size:clamp(24px,3.4vw,34px)}
.casehead .where{color:var(--ink-soft);font-size:16px}
.tag{font-family:'Special Elite','Courier New',monospace;font-size:13px;background:var(--stamp);color:#fff;padding:2px 8px;border-radius:2px}

/* Investigate */
.inv{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
@media (max-width:900px){.inv{grid-template-columns:1fr}}
.scene{border:3px solid var(--manila-ink);border-radius:4px;overflow:hidden;background:#000;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene .hint-strip{position:absolute;left:0;right:0;bottom:0;background:rgba(15,22,19,.78);color:#f2efe6;font-size:14px;padding:6px 12px}
.hs{cursor:pointer;outline:none}
.hs:hover,.hs:focus-visible{filter:brightness(1.12) drop-shadow(0 0 7px #ffe58a)}
.hs.secret:hover,.hs.secret:focus-visible{filter:brightness(1.06)}
.mk circle.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion: reduce){.mk circle.pulse{animation:none;opacity:0}}

.board{background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:14px}
.board h3{margin:0 0 4px;font-size:19px}
.board .prog{font-size:14px;color:var(--ink-soft);margin:0 0 10px}
.cluelist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.cluelist button{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:15px;line-height:1.35}
.cluelist button:hover{background:var(--wall)}
.cluelist .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--ink-soft);margin-top:1px;display:grid;place-items:center;font-size:12px}
.cluelist .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.cluelist .sec .dot{background:var(--stamp);border-color:var(--stamp);color:#fff}
.cluelist small{display:block;color:var(--ink-soft);font-size:13px}

/* Modal + document */
#modal{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(3vh,env(safe-area-inset-top,0px)) 12px 3vh;overflow:auto}
.sheet{position:relative;background:var(--paper);color:var(--paper-ink);width:min(780px,100%);border-radius:2px;padding:26px clamp(18px,4vw,40px) 22px;box-shadow:0 18px 50px rgba(0,0,0,.35);background-image:repeating-linear-gradient(transparent 0 31px, rgba(120,100,60,.07) 31px 32px)}
.sheet .kind{font-family:'Special Elite','Courier New',monospace;font-size:14px;color:var(--paper-soft)}
.sheet h2{margin:2px 0 14px;font-size:clamp(22px,3vw,30px);color:var(--paper-ink)}
.stampmark{position:absolute;top:18px;right:22px;font-family:'Special Elite','Courier New',monospace;color:#5a3e8e;border:3px solid #5a3e8e;padding:2px 10px;transform:rotate(7deg);opacity:.75;font-size:15px}
.mission{background:#efe0b4;border-left:5px solid #5a3e8e;padding:10px 14px;margin:0 0 18px;font-size:16px;color:#2a2416}
.mission.secret{border-left-color:#b3352b;background:#f3d6cf}
.docbody{font-size:17px}
.blk{margin:0 0 14px;padding:2px 0}
.blk.hinted{outline:2px dashed #5a3e8e;outline-offset:6px;border-radius:2px}
.u{cursor:pointer;border-radius:2px;padding:0 2px;transition:background .15s}
.u:hover,.u:focus-visible{background:rgba(90,62,142,.13)}
.u.miss{text-decoration:line-through;text-decoration-color:#b3352b;text-decoration-thickness:2px;color:#7b766b;cursor:default}
.u.hit{background:var(--hl);color:#1f2523;box-shadow:0 0 0 2px var(--hl)}
.solved .u{cursor:default}
.solved .u:hover{background:transparent}
.solved .u.hit:hover{background:var(--hl)}
.chat .msg{display:block;margin:0 0 8px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.55);border:1px solid var(--paper-line)}
.chat .who{font-weight:600;font-size:14px;display:block;color:#3b4a44}
.doclist{margin:0;padding-left:20px}
.doclist li{margin:0 0 6px}
.dtable{width:100%;border-collapse:collapse;font-size:15px}
.dtable th{text-align:left;font-family:'Special Elite','Courier New',monospace;font-weight:400;border-bottom:2px solid #8a8370;padding:5px 6px}
.dtable td{border-bottom:1px solid var(--paper-line);padding:6px;vertical-align:top}
.dtable tr.u{display:table-row}
.dtable tr.u.hit td{background:var(--hl)}
.tablewrap{overflow-x:auto}
.sheet-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;border-top:1px dashed #b5ab92;padding-top:14px}
.found-note{margin-top:16px;background:#dfeee4;border:2px solid #2f6b4f;padding:12px 14px;color:#1d3b2c}
.found-note b{font-family:'Special Elite','Courier New',monospace;font-weight:400}
.bigstamp{position:absolute;right:34px;bottom:96px;font-family:'Special Elite','Courier New',monospace;font-size:30px;color:#2f6b4f;border:4px double #2f6b4f;padding:4px 14px;transform:rotate(-9deg);pointer-events:none;animation:thump .35s ease-out}
@keyframes thump{0%{transform:rotate(-9deg) scale(1.8);opacity:0}100%{transform:rotate(-9deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion: reduce){.bigstamp{animation:none}}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2523;color:#f3efe4;padding:10px 16px;border-radius:3px;font-size:15px;z-index:90;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* Dialog */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.dlg-box{max-width:980px;margin:0 auto;display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;background:var(--paper);color:var(--paper-ink);border:3px solid var(--manila-ink);border-radius:4px;padding:14px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.dlg-box.nar{grid-template-columns:1fr}
.dlg-por{width:110px;height:110px;background:#cddcd2;border:2px solid var(--manila-ink);border-radius:3px;overflow:hidden}
.dlg-por svg{width:100%;height:100%;display:block}
.dlg-name{font-family:'Special Elite','Courier New',monospace;font-size:17px;color:#5a3e8e;margin-bottom:2px}
.dlg-text{font-size:18px;min-height:3.2em}
.dlg-nar .dlg-text{font-style:italic}
.dlg-ctl{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
@media (max-width:600px){.dlg-box{grid-template-columns:64px minmax(0,1fr)}.dlg-por{width:64px;height:64px}.dlg-text{font-size:16px}}

/* Question */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
@media (max-width:900px){.qwrap{grid-template-columns:1fr}}
.qcard{background:var(--paper);color:var(--paper-ink);border:2px solid var(--manila-ink);border-radius:3px;padding:22px clamp(16px,3vw,30px)}
.qmeta{font-family:'Special Elite','Courier New',monospace;font-size:14px;color:var(--paper-soft)}
.qcard h2{font-size:clamp(20px,2.6vw,26px);margin:6px 0 10px;color:var(--paper-ink);line-height:1.25}
.qcard .ctx{color:#3e3b33;margin:0 0 14px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;text-align:left;background:#fffdf7;border:2px solid #cbbf9f;border-radius:3px;padding:10px 12px;color:#1f2523;line-height:1.4}
.opt .let{font-family:'Special Elite','Courier New',monospace;font-size:18px;color:#5a3e8e}
.opt:hover{border-color:#5a3e8e}
.opt.sel{border-color:#5a3e8e;background:#ece4f7;box-shadow:inset 0 0 0 1px #5a3e8e}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.qfoot .note{font-size:14px;color:var(--paper-soft)}
.evcards{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.evcard{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-left:5px solid var(--string);padding:8px 10px;font-size:14px;line-height:1.4;border-radius:2px;text-align:left}
.evcard b{font-family:'Special Elite','Courier New',monospace;font-weight:400;display:block;font-size:14px}
.evcard.pick{cursor:pointer}
.evcard.pick.on{border-left-color:#5a3e8e;background:#ece4f7;box-shadow:inset 0 0 0 2px #5a3e8e}
.evcard.sec{border-left-color:#5a3e8e}

/* Minigame */
.mg-grid{display:flex;flex-direction:column;gap:10px}
.mg-item{background:#fffdf7;border:1px solid #cbbf9f;border-radius:3px;padding:10px 12px;color:#1f2523}
.mg-item p{margin:0 0 8px}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.boxes button{width:38px;height:36px;border:2px solid #b5a982;background:#fff;border-radius:3px;font-family:'Special Elite','Courier New',monospace;font-size:16px;color:#1f2523}
.boxes button.on{background:#5a3e8e;border-color:#5a3e8e;color:#fff}
.bmc{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto auto;gap:3px;font-size:12px;margin:8px 0 16px}
.bmc div{background:#fffdf7;border:1px solid #b5a982;padding:6px;color:#1f2523;line-height:1.25}
.bmc b{font-family:'Special Elite','Courier New',monospace;font-weight:400;color:#5a3e8e;font-size:14px;display:block}
.bmc .kp{grid-column:1;grid-row:1/3}.bmc .ka{grid-column:2;grid-row:1}.bmc .kr{grid-column:2;grid-row:2}
.bmc .vp{grid-column:3;grid-row:1/3}.bmc .cr{grid-column:4;grid-row:1}.bmc .chn{grid-column:4;grid-row:2}
.bmc .cs{grid-column:5;grid-row:1/3}.bmc .cost{grid-column:1/4;grid-row:3}.bmc .rev{grid-column:4/6;grid-row:3}

/* Chapter end, ending, resume */
.paperpage{background:var(--paper);color:var(--paper-ink);border:2px solid var(--manila-ink);border-radius:3px;padding:26px clamp(16px,4vw,40px);position:relative;max-width:900px;margin:0 auto}
.paperpage h2{margin:0 0 6px;color:var(--paper-ink);font-size:clamp(24px,3.4vw,34px)}
.paperpage p{max-width:72ch}
.closedstamp{position:absolute;top:22px;right:24px;font-family:'Special Elite','Courier New',monospace;color:#b3352b;border:3px solid #b3352b;padding:3px 12px;transform:rotate(8deg);font-size:20px}
.kv{display:flex;flex-wrap:wrap;gap:8px 26px;margin:14px 0;padding:0;list-style:none;font-size:16px}
.kv b{font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:22px;display:block}
.ending-art{border:3px solid var(--manila-ink);border-radius:4px;overflow:hidden;max-width:900px;margin:0 auto 18px;background:#000}
.ending-art svg{display:block;width:100%;height:auto}
.outcomes{list-style:none;padding:0;margin:14px 0}
.outcomes li{border-top:1px dashed #b5ab92;padding:10px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
@media (max-width:600px){.outcomes li{grid-template-columns:1fr;gap:2px}}
.outcomes .lbl{font-family:'Special Elite','Courier New',monospace;color:#5a3e8e}
.rtable{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 18px}
.rtable th{text-align:left;font-family:'Special Elite','Courier New',monospace;font-weight:400;border-bottom:2px solid #8a8370;padding:5px 6px;white-space:nowrap}
.rtable td{border-bottom:1px solid var(--paper-line);padding:6px;vertical-align:top}
.rtable td.pt{white-space:nowrap;text-align:center;font-family:'Special Elite','Courier New',monospace}
.ok{color:#2f6b4f}.bad{color:#b3352b}.mid{color:#8a5a00}
.res-ch{margin:26px 0 0;padding-top:12px;border-top:3px double #8a8370}
.res-ch h3{margin:0 0 4px;font-size:22px;color:var(--paper-ink)}
.lesson{background:#efe0b4;padding:10px 14px;border-left:5px solid #5a3e8e;margin:8px 0 12px;font-size:15px}

/* Notebook */
.nb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.nb-tabs button{border:2px solid #b5a982;background:#fffdf7;padding:6px 12px;border-radius:3px;font-family:'Special Elite','Courier New',monospace;font-size:14px;color:#1f2523}
.nb-tabs button.on{background:#5a3e8e;border-color:#5a3e8e;color:#fff}
.nb-tabs button:disabled{opacity:.4;cursor:not-allowed}
.nb h4{font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:18px;margin:18px 0 6px;color:#5a3e8e}
.nb p,.nb li{font-size:16px}
.nb table{border-collapse:collapse;width:100%;font-size:14px}
.nb td,.nb th{border-bottom:1px solid var(--paper-line);padding:5px 6px;text-align:left;vertical-align:top}
.nb th{font-family:'Special Elite','Courier New',monospace;font-weight:400}

@media print{
  #hud,#dlg,#toast,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .paperpage{border:none;padding:0;max-width:none;background:#fff}
  .res-ch{break-inside:auto}
  .rtable tr{break-inside:avoid}
}
@media (max-width:600px){.scene .hint-strip{position:static}}
.rtable.wide{min-width:720px}
#sndPanel{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:16px;z-index:40;background:var(--paper);color:var(--paper-ink);border:2px solid var(--manila-ink);border-radius:3px;padding:14px 16px;width:250px;box-shadow:4px 4px 0 var(--manila-ink);display:flex;flex-direction:column;gap:10px;font-size:15px}
#sndPanel.hidden{display:none}
#sndPanel label{display:flex;flex-direction:column;gap:4px;font-family:'Special Elite','Courier New',monospace}
#sndPanel label.sw{flex-direction:row;align-items:center;gap:8px}
#sndPanel input[type=range]{accent-color:#5a3e8e;width:100%}
#sndPanel p{margin:0;font-size:13px;color:var(--paper-soft)}
</style>
</head>
<body>
<header id="hud">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="20" rx="2" fill="#e4c98c" stroke="#4a3a17" stroke-width="2"/><path d="M3 11h10l3-4h13" fill="none" stroke="#4a3a17" stroke-width="2"/><circle cx="23" cy="19" r="4" fill="none" stroke="#b3352b" stroke-width="2.4"/><path d="M26 22l3 3" stroke="#b3352b" stroke-width="2.4"/></svg>Berkas Merah</div>
  <span class="stat" id="hCase">Biro Telisik</span>
  <span class="stat">Bukti <b id="hClues">0/24</b></span>
  <span class="stat">Bisikan <b id="hHints">0</b></span>
  <span class="stat">Waktu <b id="hTime">00:00:00</b></span>
  <div class="hud-btns">
    <button class="btn small ghost" id="bNote">Buku Saku</button>
    <button class="btn small ghost" id="bSave">Simpan</button>
    <button class="btn small ghost" id="bSound" aria-pressed="true">Suara</button>
    <button class="btn small ghost" id="bTheme" aria-label="Ganti tema terang/gelap">Tema</button>
  </div>
</header>
<div id="sndPanel" class="hidden" role="dialog" aria-label="Pengaturan suara">
  <label class="sw"><input type="checkbox" id="sOn" checked> Suara aktif</label>
  <label>Musik latar<input type="range" id="sMus" min="0" max="100" value="60"></label>
  <label>Efek suara<input type="range" id="sSfx" min="0" max="100" value="80"></label>
  <label>Suasana TKP<input type="range" id="sAmb" min="0" max="100" value="70"></label>

 secret:{id:'s1',title:'Map Biru di Laci: Proposal Rani',kind:'Bukti rahasia',

 {tab:'P2 Transformasi',html:`
 <h4>Tiga tingkat perubahan</h4>

 <p>Uji berurutan: (1) ada data pindah dari kertas ke layar? (2) ada langkah kerja yang dikerjakan sistem? (3) ada blok model bisnis yang berubah? Berhenti di pertanyaan pertama yang jawabannya “ya, dan hanya itu”. Tingkat 3 tidak otomatis lebih baik.</p>

 <p>Transformasi bukan soal beli software mahal. Punya akun TikTok baru penambahan saluran promosi. UMKM kecil tetap butuh, hanya bentuknya berbeda. Digital mengubah komposisi pekerjaan, bukan otomatis mengurangi karyawan.</p>
 <h4>Disrupsi digital</h4>
 <p>Perubahan yang membuat cara lama memberi nilai jadi tidak relevan. Pendatang melayani kebutuhan yang sama dengan struktur biaya dan pengalaman yang sangat berbeda. Menurut Christensen, pendatang masuk dari segmen yang diabaikan pemain besar, lalu naik kelas.</p>
 <p>Anatomi: (1) ada friksi yang dianggap wajar, (2) teknologi baru menghapus friksi, (3) pendatang masuk dari segmen yang diabaikan, (4) efek jaringan dan data mempercepat pertumbuhan, (5) pemain lama baru merespons saat pasar sudah pindah.</p>
 <h4>Kenapa pemain lama terlambat</h4>

 {tab:'P3 Model Bisnis',html:`
 <h4>Model bisnis dalam 3 pertanyaan</h4>

 {tab:'P4 BMC',html:`
 <h4>Sembilan kotak dan pertanyaannya</h4>

 <tr><td>3</td><td>Channels</td><td>Lewat jalan mana pelanggan tahu, membeli, menerima?</td></tr>

 <tr><td>9</td><td>Cost Structure</td><td>Uang keluar untuk apa?</td></tr></table>
 <p>Sisi kanan (1 sampai 5) adalah ruang makan: pelanggan dan uang masuk. Sisi kiri (6 sampai 9) adalah dapur: cara kerja dan uang keluar. Value proposition menjembatani keduanya. Isi dari kanan dulu.</p>
 <h4>Empat benang merah</h4>
 <ul><li>1 dengan 2: value proposition menjawab kebutuhan segmen.</li><li>2 dengan 5: pelanggan mau membayar untuk janji itu.</li><li>2 dengan 6, 7, 8: dapur sanggup menepati janji.</li><li>6, 7, 8 dengan 9: setiap sumber daya dan aktivitas punya biaya.</li></ul>
 <h4>Tips</h4>
 <p>“Semua orang” bukan segmen. Value proposition adalah masalah yang diselesaikan, bukan daftar fitur. Pilih mitra untuk hal yang lebih murah atau lebih baik dikerjakan pihak lain.</p>`},
 {tab:'P5 VPC',html:`
 <h4>Ukur dulu, baru jahit</h4>
 <p>Customer profile (lingkaran) berisi jobs, pains, gains. Value map (kotak) berisi products and services, pain relievers, gain creators. Fit terjadi bila setiap isi kotak punya pasangan di lingkaran. VPC adalah kaca pembesar untuk kotak 1 dan 2 BMC.</p>

const SND=(function(){
  const st={on:true,music:.6,sfx:.8,amb:.7};
  let ctx=null,master,musicBus,sfxBus,ambBus,verb,delayIn,noiseBuf,brownBuf;
  let want={m:null,a:null,al:1},cur=null,amb=null;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const R=a=>a[Math.floor(Math.random()*a.length)];
  function mk(v){const g=ctx.createGain();g.gain.value=v;return g;}

  function init(){
    if(ctx){if(ctx.state==='suspended'&&st.on&&!document.hidden)ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC();}catch(e){ctx=null;return;}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;
    master=mk(st.on?1:0.0001);master.connect(comp);comp.connect(ctx.destination);
    musicBus=mk(st.music*.7);sfxBus=mk(st.sfx);ambBus=mk(st.amb*.6);
    [musicBus,sfxBus,ambBus].forEach(b=>b.connect(master));
    verb=ctx.createConvolver();verb.buffer=impulse(3,2.6);const vo=mk(.85);verb.connect(vo);vo.connect(master);
    [[musicBus,.32],[sfxBus,.16],[ambBus,.1]].forEach(p=>{const s=mk(p[1]);p[0].connect(s);s.connect(verb);});
    const dl=ctx.createDelay(1.5);dl.delayTime.value=.42;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const fb=mk(.33);
    dl.connect(lp);lp.connect(fb);fb.connect(dl);const dOut=mk(.5);lp.connect(dOut);dOut.connect(musicBus);
    delayIn=mk(1);delayIn.connect(dl);
    noiseBuf=makeNoise(false);brownBuf=makeNoise(true);
    setInterval(sched,25);
    document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(st.on)ctx.resume();});
    apply();
  }
  function impulse(sec,decay){const r=ctx.sampleRate,len=Math.floor(r*sec),b=ctx.createBuffer(2,len,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
  function makeNoise(brown){const r=ctx.sampleRate,len=r*3,b=ctx.createBuffer(1,len,r),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}return b;}

  function envGain(dest,t,a,peak,dec){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);g.connect(dest);return g;}
  function tone(type,f,t,a,peak,dec,dest,detune){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(detune)o.detune.value=detune;o.connect(envGain(dest,t,a,peak,dec));o.start(t);o.stop(t+a+dec+.05);return o;}
  function noise(t,dur,v,ftype,freq,q,dest,a){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(freq,t);if(q)f.Q.value=q;s.connect(f);f.connect(envGain(dest,t,a||.003,v,dur));s.start(t,Math.random()*2);s.stop(t+(a||.003)+dur+.05);return f;}
  function bass(m,t,dur,v,dest){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;lp.connect(dest);const f=mtof(m);tone('triangle',f,t,.008,v,dur,lp);tone('sine',f,t,.008,v*.7,dur,lp);}

    const c=ctx.createOscillator();c.frequency.value=f;const mod=ctx.createOscillator();mod.frequency.value=f;

    inv1:()=>invTrack(147),inv2:()=>invTrack(165),inv3:()=>invTrack(131),inv4:()=>invTrack(156),
    analysis:()=>({bpm:96,bars:2,step(s,b,t,o,sd){
      const arp=[[57,60,64,60,57,60,65,60],[55,59,62,59,55,59,64,59]];
      if(s%2===0)ep(arp[b][s/2],t,sd*1.2,.04,o);
      if(s===0){bass([45,43][b],t,sd*14,.22,o);pad([[57,60,64],[55,59,62]][b].map(mtof),t,sd*16,.018,o,700);}
      if(s%4===0)tick(t,.1,o,s%8===0?3200:2400);
    }}),
    sidang:()=>({bpm:60,bars:2,step(s,b,t,o,sd){
      if(s===0||s===2)kick(t,s===0?.3:.2,o,70,40);
      if(s%4===0)tick(t,.06,o,2600);
      if(s===0&&b===0){pad([38,45,50,53].map(mtof),t,sd*32,.028,o,500);bell(mtof(50),t,.14,4,o,.2);}
      if(s===8&&b===1&&Math.random()<.6)bell(mtof(57+R([0,1,3])),t,.05,2,o,.3);
    }}),
    end_bad:()=>({bpm:56,bars:4,step(s,b,t,o,sd){
      const c=[[50,53,57],[46,50,53],[43,46,50],[45,49,52]];
      if(s===0){pad(c[b].map(mtof),t,sd*16,.032,o,600);bass(c[b][0]-12,t,sd*12,.2,o);}
      if(s===8&&b%2===0)bell(mtof(c[b][2]+12),t,.06,3,o,.3);
    }}),
    end_good:()=>({bpm:72,bars:4,step(s,b,t,o,sd){
      const c=[[53,57,60,64],[52,55,60,64],[50,53,57,60],[46,50,53,57]],r=[41,40,38,46];
      if(s===0||s===8){c[b].forEach(m=>ep(m,t,sd*6,.05,o));bass(s===0?r[b]:r[b]+7,t,sd*6,.26,o);}
      if(s%2===0)noise(t,.05,.025,'highpass',7500,0,o);
      if((s===4||s===12)&&Math.random()<.5)ep(c[b][Math.floor(Math.random()*4)]+12,t,sd*2,.04,o);
    }}),
    end_true:()=>({bpm:84,bars:4,step(s,b,t,o,sd){
      const c=[[50,54,57,62],[49,52,57,61],[47,50,54,57],[43,47,50,55]],r=[38,37,35,43];
      if(s===0||s===6||s===10)c[b].forEach(m=>ep(m,t,sd*(s===0?5:3),.045,o));
      if(s===0||s===8)bass(r[b]+(s===8?7:0),t,sd*6,.28,o);
      if(s===0||s===8)kick(t,.22,o,110,45);
      if(s%2===0){noise(t,.05,.025,'highpass',7500,0,o);bell(mtof(c[b][(s/2)%4]+24),t,.05,1.2,o,.3);}
      if(s===0&&b===0)bell(mtof(38),t,.3,5,o,0);
    }})
  };

  /* ---------- Suasana TKP ---------- */
  function loopNoise(buf,ft,freq,v,out,q,srcs){const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const f=ctx.createBiquadFilter();f.type=ft;f.frequency.value=freq;if(q)f.Q.value=q;const g=mk(v);s.connect(f);f.connect(g);g.connect(out);s.start();srcs.push(s);return g;}
  function every(min,max,fn,alive){(function go(){if(!alive.v)return;if(!document.hidden&&st.on)fn(ctx.currentTime+.05);setTimeout(go,(min+Math.random()*(max-min))*1000);})();}
  function motor(t,out){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(60,t);o.frequency.linearRampToValueAtTime(96,t+1.6);o.frequency.linearRampToValueAtTime(55,t+3.4);
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=480;const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+1.6);g.gain.exponentialRampToValueAtTime(.0001,t+3.5);
    let last=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.setValueAtTime(R([-1,1]),t);p.pan.linearRampToValueAtTime(-p.pan.value,t+3.5);g.connect(p);last=p;}
    o.connect(f);f.connect(g);last.connect(out);o.start(t);o.stop(t+3.6);}
  function bird(t,out){const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++){const tt=t+i*.14,o=ctx.createOscillator();o.frequency.setValueAtTime(2800,tt);o.frequency.exponentialRampToValueAtTime(4300,tt+.07);o.connect(envGain(out,tt,.005,.018,.08));o.start(tt);o.stop(tt+.12);}}
  const AMB={
    rain(out,al,srcs){loopNoise(noiseBuf,'bandpass',2600,.05,out,.4,srcs);loopNoise(brownBuf,'lowpass',500,.22,out,0,srcs);every(.12,.5,t=>noise(t,.02,.015+Math.random()*.03,'highpass',3000+Math.random()*3000,0,out),al);},
    print(out,al,srcs){loopNoise(brownBuf,'lowpass',340,.32,out,0,srcs);const h=ctx.createOscillator();h.frequency.value=100;const hg=mk(.012);h.connect(hg);hg.connect(out);h.start();srcs.push(h);
      every(1,1,t=>tick(t,.045,out,2100),al);every(2.6,4.6,t=>{kick(t,.16,out,80,50);noise(t,.12,.05,'bandpass',900,1.2,out);noise(t+.18,.08,.03,'bandpass',1400,2,out);},al);},
    cowork(out,al,srcs){loopNoise(brownBuf,'lowpass',260,.28,out,0,srcs);every(3,7,t=>{const n=3+Math.floor(Math.random()*6);let tt=t;for(let i=0;i<n;i++){typeKey(tt,out,.045);tt+=.08+Math.random()*.1;}},al);},
    street(out,al,srcs){loopNoise(brownBuf,'lowpass',650,.55,out,0,srcs);every(5,10,t=>motor(t,out),al);every(6,13,t=>bird(t,out),al);},
    kantin(out,al,srcs){const gs=[420,850,1500].map(fr=>loopNoise(noiseBuf,'bandpass',fr,.035,out,1.4,srcs));
      every(.25,.4,t=>gs.forEach(g=>g.gain.setTargetAtTime(.015+Math.random()*.05,t,.12)),al);
      every(1.5,4,t=>bell(2200+Math.random()*1300,t,.025,.25,out,0),al);
      every(5,9,t=>{for(let i=0;i<3;i++)bell(1800+Math.random()*1500,t+i*.07,.02,.18,out,0);},al);},
    room(out,al,srcs){loopNoise(brownBuf,'lowpass',200,.2,out,0,srcs);every(1,1,t=>tick(t,.035,out,2400),al);}
  };

  /* ---------- Penjadwal ---------- */
  function sched(){
    if(!cur||!ctx)return;const sd=60/cur.tr.bpm/4;
    if(cur.next<ctx.currentTime-.3)cur.next=ctx.currentTime+.05;
    while(cur.next<ctx.currentTime+.12){const s=cur.step%16,b=Math.floor(cur.step/16)%cur.tr.bars;try{cur.tr.step(s,b,cur.next,cur.out,sd);}catch(e){}cur.next+=sd;cur.step++;}
  }
  function fadeOut(g,stopList){const now=ctx.currentTime;g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.setTargetAtTime(.0001,now,.45);
    setTimeout(()=>{(stopList||[]).forEach(s=>{try{s.stop();}catch(e){}});try{g.disconnect();}catch(e){}},2600);}
  function apply(){
    if(!ctx)return;const now=ctx.currentTime;
    if(!cur||cur.key!==want.m){
      if(cur)fadeOut(cur.out);cur=null;
      if(want.m&&TRACKS[want.m]){const out=mk(.0001);out.connect(musicBus);out.gain.setTargetAtTime(1,now,.6);cur={key:want.m,tr:TRACKS[want.m](),out:out,next:now+.15,step:0};}
    }
    if(!amb||amb.key!==want.a){
      if(amb){amb.alive.v=false;fadeOut(amb.out,amb.srcs);}amb=null;
      if(want.a&&AMB[want.a]){const out=mk(.0001);out.connect(ambBus);out.gain.setTargetAtTime(1,now,.8);const a={key:want.a,out:out,alive:{v:true},srcs:[]};AMB[want.a](out,a.alive,a.srcs);amb=a;}
    }
    ambBus.gain.setTargetAtTime(st.amb*.6*want.al,now,.5);
  }
  function scene(ph,ch,ek){
    const cA=['print','cowork','street','kantin'][ch]||'rain';
    let w={m:'office',a:'rain',al:1};
    if(['intro','inv','outro'].indexOf(ph)>=0)w={m:'inv'+(ch+1),a:cA,al:1};
    else if(['mg','q','ded'].indexOf(ph)>=0)w={m:'analysis',a:cA,al:.4};
    else if(ph==='final'||ph==='finalQ')w={m:'sidang',a:'room',al:1};
    else if(ph==='ending'||ph==='resume')w={m:'end_'+(ek||'good'),a:null,al:1};
    want=w;apply();
  }

  /* ---------- Efek suara ---------- */
  function sfx(name){
    if(!ctx||!st.on)return;const t=ctx.currentTime+.01,o=sfxBus;
    switch(name){
      case 'click':tone('sine',1050,t,.002,.05,.04,o);noise(t,.012,.035,'highpass',3000,0,o);break;
      case 'type':typeKey(t,o,.05+Math.random()*.03);break;
      case 'paper':{const f=noise(t,.3,.12,'bandpass',1200,.9,o,.05);f.frequency.exponentialRampToValueAtTime(5200,t+.3);noise(t+.14,.18,.05,'highpass',4200,0,o,.02);break;}
      case 'stamp':kick(t,.45,o,115,40);noise(t,.09,.17,'lowpass',1400,0,o);noise(t+.005,.05,.07,'bandpass',3000,1,o);break;
      case 'found':sfx('stamp');[659,784,988].forEach((f,i)=>bell(f,t+.16+i*.11,.1,1.4,o,0));break;
      case 'wrong':{const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(o);tone('square',220,t,.005,.05,.13,lp);tone('square',185,t+.14,.005,.05,.2,lp);break;}
      case 'hint':noise(t,.7,.045,'bandpass',2600,3,o,.35);bell(523,t+.15,.06,1.6,o,0);break;
      case 'secret':{const sc=slendro(523);for(let i=0;i<7;i++)bell(sc(i),t+i*.07,.07,1.6,o,0);noise(t,.9,.025,'highpass',6500,0,o,.2);break;}
      case 'closed':kick(t,.6,o,95,35);noise(t,.15,.24,'lowpass',1000,0,o);bell(73.4,t+.05,.38,5,o,0);bell(146.8,t+.05,.12,4,o,0);break;
      case 'gavel':[0,.28].forEach(d=>{tone('sine',190,t+d,.001,.35,.09,o);noise(t+d,.05,.2,'bandpass',850,2,o);kick(t+d,.25,o,90,50);});break;
    }
  }
  function setOn(v){st.on=v;if(!ctx){if(v)init();return;}const now=ctx.currentTime;master.gain.setTargetAtTime(v?1:.0001,now,.08);if(v&&ctx.state==='suspended')ctx.resume();}
  function setVol(k,v){st[k]=v;if(!ctx)return;const now=ctx.currentTime;if(k==='music')musicBus.gain.setTargetAtTime(v*.7,now,.05);if(k==='sfx')sfxBus.gain.setTargetAtTime(v,now,.05);if(k==='amb')ambBus.gain.setTargetAtTime(v*.6*want.al,now,.05);}
  return{init:init,scene:scene,sfx:sfx,setOn:setOn,setVol:setVol,st:st};
})();

/* ================= MESIN GAME ================= */
const $=s=>document.querySelector(s);
const stage=$('#stage');
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fresh(){return{v:1,name:'',ch:-1,phase:'title',qi:0,clues:{},sec:{},ans:{},ded:{},mg:{},final:null,elapsed:0,started:false,done:false};}
let S=fresh();
const ALL_CLUES=CH.reduce((a,c)=>a.concat(c.clues.map(x=>x.id)),[]);
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){return t.replace(/\{nama\}/g,S.name||'Detektif');}
function fmtTime(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),2600);}

/* ---------- Skor ---------- */
function clueObj(id){for(const c of CH){for(const k of c.clues)if(k.id===id)return k;if(c.secret.id===id)return c.secret;}return null;}
function cluePts(id){const c=S.clues[id];if(!c||!c.found)return 0;return Math.max(1,5-Math.min(3,c.wrong||0)-(c.hint?2:0));}
function qPts(q){const a=S.ans[q.id];return a==null?0:q.opts[a].p;}
function qMax(q){return Math.max.apply(null,q.opts.map(o=>o.p));}
function dedPts(ch){const d=S.ded[ch.id];if(!d)return 0;let p=ch.ded.opts[d.opt].p;d.ev.forEach(e=>{if(ch.ded.ev.indexOf(e)>=0)p+=5;});return p;}
function dedMax(ch){return Math.max.apply(null,ch.ded.opts.map(o=>o.p))+10;}
function mgPts(ch){if(!ch.mg)return 0;let p=0;ch.mg.items.forEach((it,i)=>{if(S.mg[i]===it.a)p+=2;});return p;}
function mgMax(ch){return ch.mg?ch.mg.items.length*2:0;}
function chScore(ch){let p=0;ch.clues.forEach(k=>p+=cluePts(k.id));ch.qs.forEach(q=>p+=qPts(q));p+=dedPts(ch)+mgPts(ch);return p;}
function chMax(ch){let p=ch.clues.length*5;ch.qs.forEach(q=>p+=qMax(q));p+=dedMax(ch)+mgMax(ch);return p;}
function secretCount(){return CH.filter(c=>S.sec[c.secret.id]).length;}
function totals(){let sc=0,mx=0;CH.forEach(c=>{sc+=chScore(c);mx+=chMax(c);});const f=S.final==null?0:FINAL.opts[S.final].p;sc+=f;mx+=15;const bonus=secretCount()*5;return{base:sc,bonus:bonus,score:sc+bonus,max:mx,pct:Math.min(100,Math.round((sc+bonus)/mx*100))};}
function chPct(ch){return Math.round(chScore(ch)/chMax(ch)*100);}

/* ---------- HUD ---------- */
function updHud(){
  const found=ALL_CLUES.filter(id=>S.clues[id]&&S.clues[id].found).length;
  $('#hClues').textContent=found+'/'+ALL_CLUES.length;
  $('#hHints').textContent=Object.values(S.clues).filter(c=>c.hint).length;
  $('#hTime').textContent=fmtTime(S.elapsed);
  $('#hCase').textContent=S.ch>=0&&S.ch<CH.length?('Berkas '+CH[S.ch].no+' dari 4'):(S.phase==='final'?'Sidang Dinas':'Biro Telisik');
}
setInterval(()=>{if(S.started&&!S.done&&document.visibilityState==='visible'){S.elapsed++;$('#hTime').textContent=fmtTime(S.elapsed);}},1000);
window.addEventListener('beforeunload',e=>{if(S.started&&!S.done){e.preventDefault();e.returnValue='';}});

/* ---------- Dialog ---------- */
function playDialog(lines,done){
  const box=$('#dlg');let i=0,timer=null,full='';
  box.classList.remove('hidden');
  function show(){
    const L=lines[i];const nar=L.w==='nar';
    box.innerHTML='<div class="dlg-box '+(nar?'nar dlg-nar':'')+'">'+(nar?'':'<div class="dlg-por">'+portrait(L.w)+'</div>')+
     '<div><div class="dlg-name">'+(nar?'':esc(L.w==='det'?('Detektif '+(S.name||'')):CAST[L.w].name))+'</div><div class="dlg-text" id="dlgText" aria-live="polite"></div>'+
     '<div class="dlg-ctl"><button class="btn ghost small" id="dlgSkip">Lewati semua</button><button class="btn small" id="dlgNext">'+(i===lines.length-1?'Selesai':'Lanjut')+'</button></div></div></div>';
    full=fmt(L.t);const el=$('#dlgText');
    if(RM){el.textContent=full;timer=null;}
    else{let k=0;el.textContent='';clearInterval(timer);timer=setInterval(()=>{k+=2;el.textContent=full.slice(0,k);if(k%6===0&&L.w!=='nar')SND.sfx('type');if(k>=full.length){clearInterval(timer);timer=null;}},16);}
    $('#dlgNext').onclick=next;$('#dlgSkip').onclick=end;
    box.querySelector('.dlg-text').onclick=next;
    $('#dlgNext').focus({preventScroll:true});
  }
  function next(){if(timer){clearInterval(timer);timer=null;$('#dlgText').textContent=full;return;}i++;if(i>=lines.length)end();else show();}
  function end(){clearInterval(timer);box.classList.add('hidden');box.innerHTML='';document.removeEventListener('keydown',kh);done&&done();}
  function kh(e){if(!$('#modal').classList.contains('hidden'))return;if(e.key==='Escape'){e.preventDefault();end();}}
  document.addEventListener('keydown',kh);
  show();
}

/* ---------- Router ---------- */
function go(phase){S.phase=phase;render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'});}
function render(){
  updHud();
  try{SND.scene(S.phase,S.ch,(S.phase==='ending'||S.phase==='resume')?endingKind():null);}catch(e){}
  const p=S.phase;
  if(p==='title')return rTitle();
  if(p==='prolog')return rCine(sceneOffice(),PROLOG,()=>{S.ch=0;go('intro');},'Biro Telisik','Kantor detektif, Karanganyar');
  if(p==='intro'){const c=CH[S.ch];return rCine(c.scene(),c.intro,()=>go('inv'),'Berkas '+c.no+': '+c.title,c.where);}
  if(p==='inv')return rInv();
  if(p==='mg')return rMg();
  if(p==='q')return rQ();
  if(p==='ded')return rDed();
  if(p==='outro'){const c=CH[S.ch];return rCine(c.scene(),c.outro,()=>go('chEnd'),'Berkas '+c.no+': '+c.title,c.where);}
  if(p==='chEnd')return rChEnd();
  if(p==='final')return rCine(sceneOffice('dinas'),FINAL.intro,()=>go('finalQ'),'Sidang Dinas','Dinas Koperasi dan UMKM Karanganyar');
  if(p==='finalQ')return rFinalQ();
  if(p==='ending')return rEnding();
  if(p==='resume')return rResume();
}
function rCine(svg,lines,done,title,where){
  stage.innerHTML='<div class="casehead"><h2>'+esc(title)+'</h2><span class="where">'+esc(where)+'</span></div><div class="scene">'+svg+'</div>';
  stage.querySelectorAll('.hs').forEach(g=>{g.removeAttribute('tabindex');g.removeAttribute('role');g.style.pointerEvents='none';});
  playDialog(lines,done);
}

/* ---------- Investigasi ---------- */
function rInv(){
  const c=CH[S.ch];
  const found=c.clues.filter(k=>S.clues[k.id]&&S.clues[k.id].found).length;
  const all=found===c.clues.length;
  let list='';
  c.clues.forEach(k=>{const st=S.clues[k.id]||{};list+='<li class="'+(st.found?'done':'')+'"><button data-open="'+k.id+'"><span class="dot">'+(st.found?'✓':'')+'</span><span>'+esc(k.title)+'<small>'+(st.found?'Bukti dicatat':esc(k.kind))+'</small></span></button></li>';});
  if(S.sec[c.secret.id])list+='<li class="sec"><button data-open="'+c.secret.id+'"><span class="dot">★</span><span>'+esc(c.secret.title)+'<small>Bukti rahasia</small></span></button></li>';
  stage.innerHTML='<div class="casehead"><h2>Berkas '+c.no+': '+esc(c.title)+'</h2><span class="tag">'+esc(c.materi)+'</span></div>'+
   '<div class="inv"><div class="scene">'+c.scene()+'<div class="hint-strip">Klik benda atau orang bertanda lingkaran. Ada satu benda tanpa tanda.</div></div>'+
   '<aside class="board"><h3>Daftar TKP</h3><p class="prog">'+found+' dari '+c.clues.length+' bukti ditemukan</p><ul class="cluelist">'+list+'</ul>'+
   '<button class="btn" id="bAnalyze" '+(all?'':'disabled')+' style="width:100%">Mulai analisis</button>'+
   (all?'':'<p class="prog" style="margin-top:8px">Temukan semua bukti bertanda untuk membuka tahap analisis.</p>')+'</aside></div>';
  // penanda
  stage.querySelectorAll('.scene .hs').forEach(g=>{
    const id=g.dataset.id;const isSec=g.classList.contains('secret');
    g.addEventListener('click',()=>openDoc(id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoc(id);}});
    if(isSec&&!S.sec[id])return;

    m.innerHTML=done?'<circle cx="'+x+'" cy="'+y+'" r="10" fill="'+(isSec?'#5a3e8e':'#2f6b4f')+'" stroke="#fff" stroke-width="2"/><path d="M'+(x-4.5)+' '+y+' l3 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>'
     :'<circle class="pulse" cx="'+x+'" cy="'+y+'" r="9" fill="none" stroke="#f6df72" stroke-width="3"/><circle cx="'+x+'" cy="'+y+'" r="8" fill="#f6df72" stroke="#4a3a17" stroke-width="2"/><text x="'+x+'" y="'+(y+4.5)+'" font-size="13" text-anchor="middle" fill="#4a3a17" font-family="Special Elite,Courier New,monospace">?</text>';

  });
  stage.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDoc(b.dataset.open));
  const ba=$('#bAnalyze');if(ba)ba.onclick=()=>{S.qi=0;go(c.mg&&!S.mgDone?'mg':'q');};
}

function renderBody(body){
  let h='';
  body.forEach((b,bi)=>{
    const hasKey=(b.u||b.rows||[]).some(u=>Array.isArray(u)?String(u[b.t==='chat'?1:0]).charAt(0)==='!':String(u).charAt(0)==='!');
    h+='<div class="blk'+(b.t==='chat'?' chat':'')+'" data-key="'+(hasKey?1:0)+'">';
    if(b.t==='p'){h+='<p style="margin:0">'+b.u.map((u,ui)=>{const k=u.charAt(0)==='!';return '<span class="u" tabindex="0" data-k="'+(k?1:0)+'" data-uid="'+bi+'-'+ui+'">'+esc(k?u.slice(1):u)+'</span>';}).join(' ')+'</p>';}
    if(b.t==='list'){h+='<ul class="doclist">'+b.u.map((u,ui)=>{const k=u.charAt(0)==='!';return '<li><span class="u" tabindex="0" data-k="'+(k?1:0)+'" data-uid="'+bi+'-'+ui+'">'+esc(k?u.slice(1):u)+'</span></li>';}).join('')+'</ul>';}
    if(b.t==='chat'){h+=b.u.map((u,ui)=>{const k=u[1].charAt(0)==='!';return '<span class="msg"><span class="who">'+esc(u[0])+'</span><span class="u" tabindex="0" data-k="'+(k?1:0)+'" data-uid="'+bi+'-'+ui+'">'+esc(k?u[1].slice(1):u[1])+'</span></span>';}).join('');}
    if(b.t==='table'){h+='<div class="tablewrap"><table class="dtable"><thead><tr>'+b.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
      b.rows.map((r,ri)=>{const k=String(r[0]).charAt(0)==='!';return '<tr class="u" tabindex="0" data-k="'+(k?1:0)+'" data-uid="'+bi+'-'+ri+'">'+r.map((c,ci)=>'<td>'+esc(ci===0&&k?c.slice(1):c)+'</td>').join('')+'</tr>';}).join('')+'</tbody></table></div>';}
    h+='</div>';
  });
  return h;
}

function openDoc(id){
  const k=clueObj(id);if(!k)return;
  const isSec=id.charAt(0)==='s';
  const st=S.clues[id]||(S.clues[id]={found:false,wrong:0,hint:false,miss:[],hit:null});
  const solved0=st.found;if(isSec&&!S.sec[id]){S.sec[id]=true;st.found=true;}
  const solved=st.found;
  SND.sfx('paper');
  const m=$('#modal');m.classList.remove('hidden');
  m.innerHTML='<div class="sheet'+(solved?' solved':'')+'" role="dialog" aria-modal="true" aria-labelledby="docT">'+
   '<div class="kind">'+esc(k.kind)+'</div><span class="stampmark">RAHASIA</span><h2 id="docT">'+esc(k.title)+'</h2>'+
   (isSec?'<div class="mission secret">Bukti rahasia ditemukan. Benda ini tidak diberi tanda. Baca baik-baik, isinya bisa mengubah akhir cerita.</div>'
         :'<div class="mission"><b>Misi:</b> '+esc(k.mission)+'</div>')+
   '<div class="docbody">'+renderBody(k.body)+'</div>'+
   '<div class="found-note'+(solved?'':' hidden')+'" id="fNote"><b>Catatan bukti</b><br>'+esc(k.summary)+'</div>'+
   '<div class="sheet-foot" id="docFoot"></div></div>';
  const sheet=m.querySelector('.sheet');
  // tandai status
  (st.miss||[]).forEach(u=>{const el=sheet.querySelector('[data-uid="'+u+'"]');if(el)el.classList.add('miss');});
  if(st.hit){const el=sheet.querySelector('[data-uid="'+st.hit+'"]');if(el)el.classList.add('hit');}
  if(st.hint&&!solved)sheet.querySelectorAll('.blk[data-key="1"]').forEach(b=>b.classList.add('hinted'));
  if(isSec&&!st.hit){sheet.querySelectorAll('.u').forEach(u=>u.style.cursor='default');}
  function foot(){
    const f=$('#docFoot');
    if(st.found){f.innerHTML='<button class="btn" id="dClose">'+(isSec?'Simpan ke papan bukti':'Kembali ke TKP')+'</button>';}
    else f.innerHTML=(st.hint?'':'<button class="btn ghost" id="dHint">Minta bisikan Inspektur (poin -2)</button>')+'<button class="btn ghost" id="dLater">Tutup dulu</button>';
    const c=$('#dClose');if(c)c.onclick=closeDoc;
    const l=$('#dLater');if(l)l.onclick=closeDoc;
    const h=$('#dHint');if(h)h.onclick=()=>{SND.sfx('hint');st.hint=true;sheet.querySelectorAll('.blk[data-key="1"]').forEach(b=>b.classList.add('hinted'));toast('Inspektur Wening: “Perhatikan bagian yang bergaris putus-putus.”');updHud();foot();};
    (c||l).focus({preventScroll:true});
  }
  foot();
  if(!solved&&!isSec){
    sheet.querySelectorAll('.u').forEach(u=>{
      const act=()=>{
        if(st.found||u.classList.contains('miss'))return;
        if(u.dataset.k==='1'){
          SND.sfx('found');st.found=true;st.hit=u.dataset.uid;u.classList.add('hit');sheet.classList.add('solved');
          sheet.querySelectorAll('.blk.hinted').forEach(b=>b.classList.remove('hinted'));
          const sp=document.createElement('div');sp.className='bigstamp';sp.textContent='BUKTI';sheet.appendChild(sp);
          $('#fNote').classList.remove('hidden');foot();updHud();
          $('#fNote').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});
        }else{
          SND.sfx('wrong');st.wrong=(st.wrong||0)+1;st.miss=st.miss||[];st.miss.push(u.dataset.uid);u.classList.add('miss');
          u.classList.add('shake');setTimeout(()=>u.classList.remove('shake'),350);
          toast(st.wrong>=3?'Belum tepat. Baca ulang misinya, atau minta bisikan.':'Bukan itu. Baca lagi misinya.');
        }
      };
      u.addEventListener('click',act);
      u.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
  }
  if(isSec&&!solved0)SND.sfx('secret');if(isSec){toast('Bukti rahasia! Bonus untuk akhir cerita.');updHud();}
}

   '<div class="row noprint"><button class="btn" id="bPrint">Cetak atau simpan PDF</button><button class="btn ghost" id="bAgain">Main lagi</button></div>';
  CH.forEach(c=>{
    h+='<section class="res-ch"><h3>Berkas '+c.no+': '+esc(c.title)+'</h3><div class="qmeta">'+esc(c.materi)+' · skor '+chScore(c)+'/'+chMax(c)+' ('+chPct(c)+'%)</div>';
    // bukti
    h+='<div class="tablewrap"><table class="rtable"><thead><tr><th>Bukti</th><th>Salah</th><th>Bisikan</th><th>Poin</th></tr></thead><tbody>';
    c.clues.forEach(kk=>{const st=S.clues[kk.id]||{};const p=cluePts(kk.id);h+='<tr><td>'+esc(kk.title)+'</td><td class="pt">'+(st.wrong||0)+'</td><td class="pt">'+(st.hint?'ya':'-')+'</td><td class="pt '+cls(p,5)+'">'+p+'/5</td></tr>';});
    h+='<tr><td>★ '+esc(c.secret.title)+'</td><td class="pt">-</td><td class="pt">-</td><td class="pt '+(S.sec[c.secret.id]?'ok':'bad')+'">'+(S.sec[c.secret.id]?'+5':'0')+'</td></tr></tbody></table></div>';
    if(c.mg){
      h+='<div class="tablewrap"><table class="rtable"><thead><tr><th>Tebak kotak</th><th>Kamu</th><th>Kunci</th><th>Poin</th></tr></thead><tbody>';
      c.mg.items.forEach((it,i)=>{const ok=S.mg[i]===it.a;h+='<tr><td>'+esc(it.t)+'</td><td class="pt">'+(S.mg[i]||'-')+'</td><td class="pt">'+it.a+'</td><td class="pt '+(ok?'ok':'bad')+'">'+(ok?2:0)+'/2</td></tr>';});
      h+='</tbody></table></div>';
    }
    h+='<div class="tablewrap"><table class="rtable wide"><thead><tr><th style="width:27%">Pertanyaan</th><th style="width:24%">Pilihanmu</th><th style="width:7%">Poin</th><th>Seharusnya dan alasannya</th></tr></thead><tbody>';
    c.qs.forEach(q=>{const a=S.ans[q.id];const p=qPts(q),mx=qMax(q);const bi=q.opts.findIndex(o=>o.p===mx);
      h+='<tr><td>'+esc(q.q)+'<br><small>'+esc(q.ref)+'</small></td><td>'+(a==null?'-':esc(q.opts[a].t))+'</td><td class="pt '+cls(p,mx)+'">'+p+'/'+mx+'</td><td><b>'+esc(q.opts[bi].t)+'.</b> '+esc(q.exp)+'</td></tr>';});
    const d=S.ded[c.id]||{opt:null,ev:[]};const dp=dedPts(c),dm=dedMax(c);const dbi=c.ded.opts.findIndex(o=>o.p===Math.max.apply(null,c.ded.opts.map(x=>x.p)));
    h+='<tr><td>Deduksi: '+esc(c.ded.q)+'</td><td>'+(d.opt==null?'-':esc(c.ded.opts[d.opt].t))+'<br><small>Bukti: '+d.ev.map(e=>esc(clueObj(e).title)).join(', ')+'</small></td><td class="pt '+cls(dp,dm)+'">'+dp+'/'+dm+'</td><td><b>'+esc(c.ded.opts[dbi].t)+'.</b> Bukti kuat: '+c.ded.ev.map(e=>esc(clueObj(e).title)).join(', ')+'. '+esc(c.ded.exp)+'</td></tr>';
    h+='</tbody></table></div></section>';
  });
  const fp=S.final==null?0:FINAL.opts[S.final].p;
  h+='<section class="res-ch"><h3>Sidang Dinas</h3><div class="tablewrap"><table class="rtable"><thead><tr><th>Rekomendasimu</th><th>Poin</th><th>Seharusnya dan alasannya</th></tr></thead><tbody><tr><td>'+(S.final==null?'-':esc(FINAL.opts[S.final].t))+'</td><td class="pt '+cls(fp,15)+'">'+fp+'/15</td><td><b>'+esc(FINAL.opts[FINAL.best].t)+'.</b> '+esc(FINAL.exp)+'</td></tr></tbody></table></div>';
  h+='<p class="lesson">Syarat akhir sejati: skor minimal 80%, minimal 3 bukti rahasia, menolak penjualan data pengguna, dan memilih pendampingan bertahap di sidang Dinas. Akhir baik: skor minimal 55%.</p></section></div>';
  stage.innerHTML=h;
  $('#bPrint').onclick=()=>window.print();
  $('#bAgain').onclick=()=>{if(confirm('Mulai permainan baru? Progres sekarang akan hilang.')){S=fresh();go('title');}};
}

/* ---------- Buku Saku ---------- */
function openNote(){
  const m=$('#modal');m.classList.remove('hidden');
  const unlocked=Math.max(0,Math.min(3,S.ch<0?0:S.ch));
  let tab=Math.min(unlocked,openNote.tab==null?unlocked:openNote.tab);
  function draw(){
    m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nbT"><div class="kind">Buku Saku Detektif</div><span class="stampmark">TEORI</span><h2 id="nbT">Ringkasan materi</h2>'+
     '<div class="nb-tabs">'+NOTEBOOK.map((n,i)=>'<button data-t="'+i+'" class="'+(i===tab?'on':'')+'" '+(i>unlocked&&!S.done?'disabled title="Terbuka saat berkas ini dimulai"':'')+'>'+esc(n.tab)+'</button>').join('')+'</div>'+
     '<div class="nb">'+NOTEBOOK[tab].html+'</div><div class="sheet-foot"><button class="btn" id="nbClose">Tutup Buku Saku</button></div></div>';
    m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;openNote.tab=tab;draw();});
    $('#nbClose').onclick=()=>{m.classList.add('hidden');m.innerHTML='';};
    $('#nbClose').focus({preventScroll:true});
  }
  draw();
}
$('#bNote').onclick=openNote;

/* ---------- Simpan / Muat ---------- */
function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))));}
function openSave(){
  if(!S.started){toast('Mulai permainan dulu sebelum menyimpan.');return;}
  const code=encode(S);const m=$('#modal');m.classList.remove('hidden');
  m.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="kind">Arsip progres</div><h2>Kode simpan</h2><p>Salin kode di bawah dan simpan di catatan HP atau dokumenmu. Untuk melanjutkan, buka game ini lagi, pilih “Lanjutkan dari kode simpan”, lalu tempel kodenya.</p>'+
   '<div class="field"><textarea id="svCode" readonly>'+code+'</textarea></div><div class="sheet-foot"><button class="btn ghost" id="svCopy">Salin kode</button><button class="btn" id="svClose">Tutup</button></div></div>';
  $('#svCopy').onclick=()=>{const ta=$('#svCode');ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('Kode tersalin.'),()=>{document.execCommand('copy');toast('Kode tersalin.');});}catch(e){document.execCommand('copy');toast('Kode tersalin.');}};
  $('#svClose').onclick=()=>{m.classList.add('hidden');m.innerHTML='';};
}
function openLoad(){
  const m=$('#modal');m.classList.remove('hidden');
  m.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="kind">Arsip progres</div><h2>Lanjutkan penyelidikan</h2><div class="field"><label for="ldCode">Tempel kode simpan</label><textarea id="ldCode"></textarea></div><div class="sheet-foot"><button class="btn ghost" id="ldCancel">Batal</button><button class="btn" id="ldGo">Muat progres</button></div></div>';
  $('#ldCode').focus();
  $('#ldCancel').onclick=()=>{m.classList.add('hidden');m.innerHTML='';};
  $('#ldGo').onclick=()=>{try{const o=decode($('#ldCode').value);if(!o||o.v!==1||typeof o.phase!=='string')throw 0;S=Object.assign(fresh(),o);m.classList.add('hidden');m.innerHTML='';
    // fase sinematik dilanjutkan ke tahap kerja berikutnya
    if(S.phase==='prolog'||S.phase==='intro'){if(S.ch<0)S.ch=0;S.phase='inv';}
    if(S.phase==='outro')S.phase='chEnd';if(S.phase==='final')S.phase='finalQ';
    toast('Progres dimuat. Selamat bekerja lagi, Detektif '+S.name+'.');render();}catch(e){toast('Kode tidak dikenali. Pastikan kodenya disalin utuh.');}};
}
$('#bSave').onclick=openSave;

/* ---------- Tema ---------- */
$('#bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';};

render();
</script>
</body></html>
